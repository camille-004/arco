repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13  # https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: ty
        name: ty
        entry: just typecheck
        language: system
        types: [python]
        pass_filenames: false
